{% macro hidden(csrf,key,action,target=none) -%}<input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="idempotency_key" value="{{ key }}"><input type="hidden" name="action" value="{{ action }}">{% if target %}<input type="hidden" name="target_id" value="{{ target }}">{% endif %}{%- endmacro %}
{% macro decision() -%}<label>Name der entscheidenden Person <input name="person" required autocomplete="name"></label><label>Konkrete Startentscheidung / Grund <input name="decision" required></label><label><input type="checkbox" name="paid_consent" value="true"> Ich habe die Finanzen manuell geprüft und bestätige den konkreten bezahlten Start (bei kostenfreier Demo nicht erforderlich).</label>{%- endmacro %}
{% macro select(name,label,values,selected=none,blank=true) -%}<label>{{ label }}<select name="{{ name }}">{% if blank %}<option value="">Offen / nicht zugeordnet</option>{% endif %}{% for item in values %}<option value="{{ item.id }}" {% if item.id|string==selected|string %}selected{% endif %}>{{ item.code }}{% if item.exact_model_id is defined %} · {{ item.exact_model_id }}{% endif %} · {{ item.id }}</option>{% endfor %}</select></label>{%- endmacro %}
